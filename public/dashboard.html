<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">
    <div class="sidebar">
        <h2><i class="fas fa-terminal"></i> Control Panel</h2>
        <nav>
            <a href="#" class="active" onclick="showSection('scripts')">
                <i class="fas fa-code"></i> Scripts
            </a>
            <a href="#" onclick="showSection('users')">
                <i class="fas fa-users"></i> Users
            </a>
            <a href="#" onclick="showSection('settings')">
                <i class="fas fa-cog"></i> Settings
            </a>
            <a href="#" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>
    </div>

    <div class="main-content">
        <div id="scripts-section">
            <div class="section-header">
                <h1>Script Management</h1>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="scriptSearch" placeholder="Search scripts..." oninput="filterScripts()">
                </div>
            </div>

            <div class="card add-script-card">
                <h2><i class="fas fa-plus-circle"></i> Add New Script</h2>
                <form onsubmit="event.preventDefault(); addScript();">
                    <div class="form-group">
                        <label for="scriptName">Script Name</label>
                        <input type="text" id="scriptName" required>
                    </div>
                    <div class="form-group">
                        <label for="scriptPath">Script Path</label>
                        <input type="text" id="scriptPath" required>
                    </div>
                    <div class="form-group">
                        <label for="scriptType">Script Type</label>
                        <select id="scriptType">
                            <option value="node">Node.js</option>
                            <option value="python">Python</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Script
                    </button>
                </form>
            </div>

            <div class="scripts-grid">
                <div class="card">
                    <h2><i class="fas fa-play-circle"></i> Running Scripts</h2>
                    <div id="scriptsList"></div>
                </div>

                <div class="card">
                    <h2><i class="fas fa-history"></i> Script History</h2>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>

        <div id="users-section" style="display: none;">
            <div class="section-header">
                <h1>User Management</h1>
            </div>

            <div class="card">
                <h2><i class="fas fa-user-plus"></i> Add New User</h2>
                <form id="add-user-form" onsubmit="addUser(event)">
                    <div class="form-group">
                        <label for="newUsername">Username</label>
                        <input type="text" id="newUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="userPassword">Password</label>
                        <input type="password" id="userPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="userRole">Role</label>
                        <select id="userRole">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add User
                    </button>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-users"></i> User List</h2>
                <div id="users-list" class="users-grid"></div>
            </div>
        </div>

        <div id="settings-section" style="display: none;">
            <div class="section-header">
                <h1>Settings</h1>
            </div>

            <div class="card">
                <h2><i class="fas fa-key"></i> Change Password</h2>
                <form id="change-password-form" onsubmit="changePassword(event)">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
